<div class="dash-layout">
  <aside class="dash-sidebar">
    <div class="sidebar-brand">
      <img src="assets/leop/logo-leop-transparent.png" alt="Leop Consulting" class="sidebar-logo">
    </div>
    <nav class="sidebar-nav">
      <a routerLink="/dashboard" class="nav-item active"><i class="fas fa-chart-line"></i> Vue générale</a>
      <a routerLink="/" class="nav-item"><i class="fas fa-home"></i> Page d'accueil</a>
      <a href="javascript:void(0)" class="nav-item"><i class="fas fa-users"></i> Candidatures</a>
      <a href="javascript:void(0)" class="nav-item"><i class="fas fa-briefcase"></i> Missions & Postes</a>
      <a href="javascript:void(0)" class="nav-item"><i class="fas fa-graduation-cap"></i> Formations</a>
      <a href="javascript:void(0)" class="nav-item"><i class="fas fa-cog"></i> Paramètres</a>
    </nav>
    <div class="sidebar-footer">
      <a routerLink="/login" class="nav-item logout"><i class="fas fa-sign-out-alt"></i> Déconnexion</a>
    </div>
  </aside>

  <main class="dash-main">
    <header class="dash-topbar">
      <div>
        <h1>Tableau de bord Leop-Consulting</h1>
        <p>Bienvenue dans votre espace de pilotage stratégique & recrutement.</p>
      </div>
      <div class="topbar-actions">
        <a routerLink="/" class="btn-visit-site"><i class="fas fa-external-link-alt"></i> Voir le site</a>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card" *ngFor="let s of stats">
        <div class="stat-icon" [style.background-color]="s.color + '15'" [style.color]="s.color">
          <i [class]="s.icon"></i>
        </div>
        <div class="stat-content">
          <span class="stat-title">{{ s.title }}</span>
          <span class="stat-val">{{ s.value }}</span>
        </div>
      </div>
    </div>

    <div class="content-card">
      <h3>Activités récentes</h3>
      <div class="activity-list">
        <div class="activity-item" *ngFor="let a of recentActivities">
          <i class="fas fa-check-circle activity-icon"></i>
          <div class="activity-body">
            <span class="activity-text">{{ a.text }}</span>
            <span class="activity-time">{{ a.time }}</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
